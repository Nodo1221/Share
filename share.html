<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V I B E 🌀 U P L O A D</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syne:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #03001c;
            --clr-1: #ff00c8; 
            --clr-2: #00fff5; 
            --clr-3: #8a2be2; 
            --clr-4: #fffc00; 
            --clr-error: #ff3333;
            --clr-success: #00ff88;
            
            --text-main: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --font-heading: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            perspective: 1000px; 
        }

        /* Animated Background Slop */
        .wavy-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 10%, rgba(138, 43, 226, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 200, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 245, 0.15) 0%, transparent 50%);
            filter: blur(80px);
            animation: bgShift 20s infinite linear alternate;
        }

        @keyframes bgShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        /* Main Glass Container */
        .main-card {
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
            z-index: 10;
            transition: transform 0.3s var(--ease-out-expo), box-shadow 0.3s ease;
            animation: cardEntrance 0.8s var(--ease-out-expo) forwards;
            opacity: 0;
            transform: translateY(40px) rotateX(10deg);
        }
        
        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0) rotateX(0deg); }
        }

        .main-card:hover {
            box-shadow: 0 30px 100px rgba(138, 43, 226, 0.3);
        }

        /* Typography Slop */
        .header { text-align: center; margin-bottom: 30px; }
        
        .vibey-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 0.9;
            background: linear-gradient(90deg, var(--clr-1), var(--clr-2), var(--clr-4), var(--clr-1));
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s linear infinite;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        
        @keyframes gradientText {
            to { background-position: 300% center; }
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* The Holographic Void */
        .drop-zone {
            position: relative;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s var(--ease-out-expo);
            border: 2px solid transparent;
            background: linear-gradient(var(--bg-deep), var(--bg-deep)) padding-box,
                        linear-gradient(135deg, var(--clr-1), var(--clr-3), var(--clr-2)) border-box;
            background-size: 200% 200%;
            animation: borderPulse 4s linear infinite;
        }
        
        @keyframes borderPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .drop-zone.dragover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(0, 255, 245, 0.4);
            border-color: rgba(255,255,255,0.5) border-box;
        }

        .file-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
        }

        /* Abstract Visualizer */
        .vibe-visualizer {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite;
        }

        .orb {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--clr-2);
            box-shadow: 0 0 20px var(--clr-2);
            animation: orbRotate 6s linear infinite;
            opacity: 0.7;
        }
        .orb:nth-child(2) {
            border-color: var(--clr-1);
            box-shadow: 0 0 20px var(--clr-1);
            animation-duration: 4s;
            animation-direction: reverse;
            transform: rotateY(45deg);
        }
        .orb:nth-child(3) {
            border-color: var(--clr-4);
            box-shadow: 0 0 20px var(--clr-4);
            animation-duration: 8s;
            transform: rotateX(45deg);
        }
        
        .core {
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #fff, 0 0 50px var(--clr-2), 0 0 70px var(--clr-1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes orbRotate {
            0% { transform: rotate3d(1, 1, 1, 0deg); }
            100% { transform: rotate3d(1, 1, 1, 360deg); }
        }

        .drop-text {
            font-weight: 600;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
        }

        /* File List Slop with Remove Buttons */
        .file-list {
            margin-top: 20px;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            border: 1px solid transparent;
            transform: translateZ(0); 
            animation: itemEntry 0.4s var(--ease-out-expo) forwards;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        
        .file-item.removing {
            animation: itemExit 0.3s var(--ease-out-expo) forwards;
        }

        @keyframes itemEntry {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes itemExit {
            to { opacity: 0; transform: translateX(30px) scale(0.9); }
        }

        .file-item:hover {
            border-color: var(--glass-border);
            background: rgba(255,255,255,0.08);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 80%;
        }

        .file-name {
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }
        .file-size { 
            color: rgba(255,255,255,0.5); 
            font-variant-numeric: tabular-nums; 
            font-size: 0.75rem;
            margin-top: 2px;
        }

        .remove-btn {
            background: rgba(255, 51, 51, 0.1);
            color: var(--clr-error);
            border: 1px solid transparent;
            width: 30px; height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .remove-btn:hover {
            background: var(--clr-error);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            transform: scale(1.1);
        }

        /* Custom Scrollbar */
        .file-list::-webkit-scrollbar { width: 4px; }
        .file-list::-webkit-scrollbar-track { background: transparent; }
        .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        /* Submit Button Slop */
        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-family: var(--font-heading);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--clr-2) 0%, var(--clr-1) 50%, var(--clr-3) 100%);
            background-size: 200% auto;
            box-shadow: 0 10px 30px rgba(255, 0, 200, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            background-position: right center;
            box-shadow: 0 15px 40px rgba(255, 0, 200, 0.5);
            transform: translateY(-2px);
        }
        
        .submit-btn:active:not(:disabled) {
            transform: translateY(1px) scale(0.98);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            transition: all 0.3s;
            opacity: 0;
        }
        
        .submit-btn:hover:not(:disabled)::after {
            animation: shine 0.8s;
        }
        
        @keyframes shine {
            0% { margin-left: -30%; opacity: 1; }
            100% { margin-left: 100%; opacity: 0; }
        }

        /* States for JS Fetch logic */
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .submit-btn.loading {
            background: linear-gradient(135deg, #444, #888);
            color: #fff;
            animation: pulse 1.5s infinite alternate;
        }
        
        .submit-btn.success {
            background: var(--clr-success);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }
        
        .submit-btn.error {
            background: var(--clr-error);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
        }

        @keyframes pulse {
            to { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .main-card { padding: 30px 20px; border-radius: 24px; width: 95%; }
            .vibey-title { font-size: 1.8rem; }
            .drop-zone { padding: 30px 10px; }
            .submit-btn { padding: 15px; font-size: 1rem; }
        }
        
        .file-list { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body>

    <div class="wavy-bg"></div>

    <div class="main-card" id="tilt-card">
        <div class="header">
            <h1 class="vibey-title">Transmit<br>Data</h1>
            <p class="subtitle">Feed the machine</p>
        </div>

        <!-- Form hijacked by JS to prevent redirect -->
        <form id="upload-form">
            
            <div class="drop-zone" id="drop-zone">
                <div class="vibe-visualizer">
                    <div class="orb"></div>
                    <div class="orb"></div>
                    <div class="orb"></div>
                    <div class="core"></div>
                </div>
                
                <p class="drop-text" id="drop-text">DROP FILES</p>
                <p style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-top:5px; pointer-events:none;">or click to browse</p>
                
                <!-- Used only to open OS file dialog -->
                <input type="file" multiple class="file-input" id="file-input">
            </div>

            <div class="file-list" id="file-list"></div>

            <button type="submit" class="submit-btn" id="submit-btn" disabled>
                Initialize
            </button>
        </form>
    </div>

    <script>
        // 1. Maintain our own File Array since FileList is immutable
        let queuedFiles = [];

        const form = document.getElementById('upload-form');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const submitBtn = document.getElementById('submit-btn');
        const dropText = document.getElementById('drop-text');

        // Drag & Drop Visuals
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.classList.add('dragover');
                dropText.innerText = "READY TO RECEIVE";
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.classList.remove('dragover');
                if(queuedFiles.length === 0) dropText.innerText = "DROP FILES";
                else updateDropText();
            }, false);
        });

        // Handle Drops
        dropZone.addEventListener('drop', (e) => {
            handleNewFiles(e.dataTransfer.files);
        }, false);

        // Handle Clicks/Browse
        fileInput.addEventListener('change', (e) => {
            handleNewFiles(e.target.files);
            fileInput.value = ""; // Reset input so same file can be picked again if removed
        });

        // Process Incoming Files
        function handleNewFiles(files) {
            const newFiles = Array.from(files);
            
            newFiles.forEach(file => {
                // Prevent duplicate files by checking name and size
                const isDuplicate = queuedFiles.some(q => q.name === file.name && q.size === file.size);
                if (!isDuplicate) {
                    queuedFiles.push(file);
                }
            });
            renderList();
        }

        // Render the UI List
        function renderList() {
            fileList.innerHTML = '';

            if (queuedFiles.length > 0) {
                updateDropText();
                submitBtn.disabled = false;
                submitBtn.innerText = "BEGIN TRANSMISSION";
                
                queuedFiles.forEach((file, index) => {
                    const size = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.style.animationDelay = `${index * 0.03}s`;
                    
                    item.innerHTML = `
                        <div class="file-info">
                            <span class="file-name">📄 ${file.name}</span>
                            <span class="file-size">${size}</span>
                        </div>
                        <button type="button" class="remove-btn" onclick="removeFile(${index}, this)">
                            ✕
                        </button>
                    `;
                    fileList.appendChild(item);
                });
            } else {
                dropText.innerText = "DROP FILES";
                submitBtn.disabled = true;
                submitBtn.innerText = "Initialize";
            }
        }

        // Remove File Handler (exposed globally for the inline onclick)
        window.removeFile = function(index, btnElement) {
            const itemElement = btnElement.closest('.file-item');
            
            // Trigger exit animation
            itemElement.classList.add('removing');
            
            // Wait for animation to finish before destroying data and re-rendering
            setTimeout(() => {
                queuedFiles.splice(index, 1);
                renderList();
            }, 300); // Matches CSS exit animation duration
        };

        function updateDropText() {
            dropText.innerText = `${queuedFiles.length} FILE${queuedFiles.length > 1 ? 'S' : ''} LOADED`;
        }

        // The AJAX Upload Handler (No Redirect)
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // <-- STOPS THE PAGE REDIRECT
            
            if (queuedFiles.length === 0) return;

            // Pack the data
            const formData = new FormData();
            queuedFiles.forEach(file => {
                formData.append('files', file); // 'files' matches your requested name
            });

            // UI State: Loading
            submitBtn.disabled = true;
            submitBtn.innerText = "TRANSMITTING...";
            submitBtn.className = "submit-btn loading";
            
            // Haptic bump
            if ('vibrate' in navigator) navigator.vibrate(30);

            try {
                // Execute the POST request via JS Fetch
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // UI State: Success
                    submitBtn.className = "submit-btn success";
                    submitBtn.innerText = "TRANSMISSION COMPLETE ✨";
                    queuedFiles = []; // Clear queue on success
                    
                    if ('vibrate' in navigator) navigator.vibrate([30, 50, 30]);

                    // Reset back to idle after 2.5 seconds
                    setTimeout(() => {
                        submitBtn.className = "submit-btn";
                        renderList(); // Re-render empty state
                    }, 2500);
                } else {
                    throw new Error("Server rejected transmission.");
                }

            } catch (error) {
                // UI State: Error
                submitBtn.className = "submit-btn error";
                submitBtn.innerText = "TRANSMISSION FAILED 💀";
                console.error("Upload error:", error);
                
                if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);

                // Reset back to idle so they can try again
                setTimeout(() => {
                    submitBtn.className = "submit-btn";
                    submitBtn.disabled = false;
                    submitBtn.innerText = "RETRY TRANSMISSION";
                }, 2500);
            }
        });

        // 3D Card Tilt (Desktop only)
        const card = document.getElementById('tilt-card');
        if (window.innerWidth > 768) { 
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                card.style.transition = "transform 0.5s ease";
            });
            
            document.addEventListener('mouseenter', () => {
                card.style.transition = "none";
            });
        }

    </script>
</body>
</html>
